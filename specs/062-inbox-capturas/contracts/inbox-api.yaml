openapi: 3.1.0
info:
  title: API de Caixa de Entrada de Capturas (Inbox de Conhecimento) - F0.7.13
  version: 1.0.0
  description: Endpoints para registro rápido, triagem, contagem reativa, promoção e vinculação de capturas.

paths:
  /api/inbox:
    get:
      summary: Listar capturas do usuário
      operationId: listInboxCaptures
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [inbox, promoted, linked, archived, all]
            default: inbox
          description: Filtro de estado das capturas
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Termo de busca textual no conteúdo e fonte
        - name: book_id
          in: query
          required: false
          schema:
            type: integer
          description: Filtrar por livro associado
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Lista de capturas retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InboxCaptureRead'
        '401':
          description: Não autenticado

    post:
      summary: Criar nova captura rápida
      operationId: createInboxCapture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxCaptureCreate'
      responses:
        '201':
          description: Captura registrada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxCaptureRead'
        '400':
          description: Dados inválidos (conteúdo vazio)
        '401':
          description: Não autenticado

  /api/inbox/count:
    get:
      summary: Obter contagem de capturas pendentes no Inbox
      operationId: getInboxCount
      responses:
        '200':
          description: Quantidade de itens com status 'inbox'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxCountResponse'
        '401':
          description: Não autenticado

  /api/inbox/{capture_id}:
    get:
      summary: Obter detalhes de uma captura
      operationId: getInboxCapture
      parameters:
        - name: capture_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxCaptureRead'
        '404':
          description: Captura não encontrada

    patch:
      summary: Atualizar dados de uma captura
      operationId: updateInboxCapture
      parameters:
        - name: capture_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxCapturePatch'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxCaptureRead'
        '404':
          description: Captura não encontrada

    delete:
      summary: Excluir definitivamente uma captura
      operationId: deleteInboxCapture
      parameters:
        - name: capture_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Captura removida com sucesso
        '404':
          description: Captura não encontrada

  /api/inbox/{capture_id}/promote:
    post:
      summary: Marcar captura como promovida para um estudo
      operationId: promoteInboxCapture
      parameters:
        - name: capture_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxPromoteRequest'
      responses:
        '200':
          description: Captura marcada como promovida com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxCaptureRead'
        '404':
          description: Captura ou estudo não encontrado

  /api/inbox/{capture_id}/link:
    post:
      summary: Vincular conteúdo da captura a um estudo existente
      operationId: linkInboxCaptureToStudy
      parameters:
        - name: capture_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxLinkRequest'
      responses:
        '200':
          description: Conteúdo anexado ao estudo e captura marcada como vinculada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxCaptureRead'
        '404':
          description: Captura ou estudo não encontrado

components:
  schemas:
    InboxCaptureCreate:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          description: Texto da reflexão, trecho ou citação em Markdown
        source_hint:
          type: string
          nullable: true
          description: Indicação opcional de página, capítulo ou fonte externa
        book_id:
          type: integer
          nullable: true
          description: ID do livro opcional associado

    InboxCapturePatch:
      type: object
      properties:
        content:
          type: string
        source_hint:
          type: string
          nullable: true
        book_id:
          type: integer
          nullable: true
        status:
          type: string
          enum: [inbox, promoted, linked, archived]

    InboxCaptureRead:
      type: object
      required:
        - id
        - user_id
        - content
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        user_id:
          type: string
        book_id:
          type: integer
          nullable: true
        book_title:
          type: string
          nullable: true
        content:
          type: string
        source_hint:
          type: string
          nullable: true
        status:
          type: string
          enum: [inbox, promoted, linked, archived]
        promoted_study_id:
          type: integer
          nullable: true
        promoted_study_title:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InboxCountResponse:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          minimum: 0

    InboxPromoteRequest:
      type: object
      required:
        - study_id
      properties:
        study_id:
          type: integer

    InboxLinkRequest:
      type: object
      required:
        - target_study_id
      properties:
        target_study_id:
          type: integer
        target_section:
          type: string
          enum: [summary, explanation, concepts, references, notes]
          default: references
