# Ambiente isolado do EXP-001 para o harness: gerador sintético, supervisor e avaliador.
# Sem bibliotecas de modelo. NÃO faz parte do pacote leitorum-di.
[project]
name = "exp-001-harness"
version = "0.0.0"
description = "EXP-001: ambiente do harness de benchmark (sem modelos)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "leitorum-di",
    "pillow",
    "fonttools",
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
leitorum-di = { path = "../../../../", editable = true }
