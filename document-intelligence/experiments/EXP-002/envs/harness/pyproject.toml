# Ambiente isolado do EXP-002 para o harness: gerador de páginas, supervisor, avaliador e baseline clássico.
# Sem bibliotecas de modelo. NÃO faz parte do pacote leitorum-di.
[project]
name = "exp-002-harness"
version = "0.0.0"
description = "EXP-002: harness de layout (sem modelos)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "leitorum-di",
    "pillow",
    "numpy",
    "opencv-python-headless",
    "fonttools",
    "jsonschema",
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
leitorum-di = { path = "../../../../", editable = true }
