[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leitorum-di"
version = "0.1.0-dev"
description = "Motor de Document Intelligence, OCR/HTR e Extração Semântica para o Leitorum"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Equipe Leitorum", email = "contato@leitorum.local" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Dependencias fundamentais minimas para contratos e validacao.
# NOTA: Bibliotecas pesadas de visao computacional e inferencia (Torch, OpenCV,
# modelos de OCR/HTR) NÃO devem ser adicionadas prematuramente aqui;
# suas inclusoes dependem dos resultados formais de cada experimento.
dependencies = [
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/leitorum_di"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = []
